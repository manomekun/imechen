[package]
name = "imechen-gpui"
version = "0.2.3"
description = "GPUI frontend prototype for imechen"
authors = ["manomekun"]
edition = "2021"
publish = false

[[bin]]
name = "imechen-gpui"
path = "src/main.rs"

[dependencies]
imechen-core = { path = "../imechen-core" }
# Pinned to the snapshot gpui-kit builds against so it can be added later without conflicts.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
# gpui already depends on futures; the progress channel needs it directly.
futures = "0.3"
