[package]
name = "imechen"
version = "0.2.3"
description = "Offline image/video converter"
authors = ["manomekun"]
edition = "2021"

[lib]
name = "imechen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
imechen-core = { path = "../crates/imechen-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
