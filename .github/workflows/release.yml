name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read version and check it against the tag
        id: version
        run: |
          # Not `cargo metadata`: the crate's rust-toolchain.toml would make rustup download a toolchain just for this.
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/imechen-gpui/Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match crates/imechen-gpui version v$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      retention-days: 1

  release:
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: imechen-*
          path: assets
          merge-multiple: true

      - name: Create draft release
        run: |
          cat > notes.md <<'EOF'
          ## インストール方法

          ### macOS
          Homebrew（推奨）: `brew install manomekun/apps/imechen`

          ワンコマンド: `curl -fsSL https://raw.githubusercontent.com/manomekun/imechen/main/install.sh | bash`

          ### Windows
          EXE インストーラーをダウンロードして実行してください。

          ### Linux
          Debian/Ubuntu: `sudo dpkg -i imechen_*.deb`
          AppImage: `chmod +x imechen_*.AppImage && ./imechen_*.AppImage`
          EOF

          for name in \
            "imechen_${VERSION}_aarch64.dmg" \
            "imechen_${VERSION}_x64.dmg" \
            "imechen_${VERSION}_x64-setup.exe" \
            "imechen_${VERSION}_amd64.deb" \
            "imechen_${VERSION}_amd64.AppImage"; do
            if [ ! -f "assets/$name" ]; then
              echo "::error::missing release asset $name"
              ls -l assets
              exit 1
            fi
          done

          gh release create "$VERSION" assets/* \
            --draft \
            --title "imechen $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
