name: Set up libheif
description: >
  Provides a static, decode-only libheif (HEVC via libde265) for libheif-sys,
  so release binaries don't depend on a libheif the user would have to install.

inputs:
  target:
    description: Rust target triple; defaults to the runner's own
    required: false
    default: ""

runs:
  using: composite
  steps:
    # libheif-sys always resolves libheif through vcpkg on MSVC.
    # At this tag libde265 is a base dependency of the port, and [core] keeps
    # out the default "hevc" feature, which is the GPL x265 encoder.
    - name: Cache vcpkg libheif
      if: runner.os == 'Windows'
      id: vcpkg-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/vcpkg
        key: vcpkg-5d4a3dc90c0b3773f3bac81bf41297b54328f471-libheif-core-x64-windows-static-md

    - name: Build libheif with vcpkg
      if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        root="$RUNNER_TEMP/vcpkg"
        # Tag 2026.10.16.
        git init -q "$root"
        git -C "$root" fetch -q --depth 1 https://github.com/microsoft/vcpkg 5d4a3dc90c0b3773f3bac81bf41297b54328f471
        git -C "$root" checkout -q FETCH_HEAD
        "$root/bootstrap-vcpkg.bat" -disableMetrics
        "$root/vcpkg.exe" install "libheif[core]:x64-windows-static-md" --clean-after-build
        rm -rf "$root/downloads" "$root/buildtrees" "$root/packages"

    - name: Point libheif-sys at vcpkg
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
        # Static libs on the dynamic CRT, which is what Rust links by default.
        echo "VCPKGRS_TRIPLET=x64-windows-static-md" >> "$GITHUB_ENV"

    # The runner image goes into the cache key: CI tests on ubuntu-24.04 but
    # packages on ubuntu-22.04, and a build against the newer glibc would not
    # link there.
    - name: Resolve build platform
      if: runner.os != 'Windows'
      id: arch
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        echo "image=${ImageOS:-$(uname -s)}" >> "$GITHUB_OUTPUT"
        if [ "$RUNNER_OS" = macOS ]; then
          case "$TARGET" in
            x86_64-apple-darwin) echo "osx=x86_64" >> "$GITHUB_OUTPUT" ;;
            aarch64-apple-darwin) echo "osx=arm64" >> "$GITHUB_OUTPUT" ;;
            *) echo "osx=$(uname -m)" >> "$GITHUB_OUTPUT" ;;
          esac
        fi

    - name: Cache libheif
      if: runner.os != 'Windows'
      id: unix-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/libheif
        key: libheif-${{ steps.arch.outputs.image }}-${{ steps.arch.outputs.osx || runner.arch }}-${{ hashFiles('scripts/build-libheif.sh') }}

    - name: Build libheif
      if: runner.os != 'Windows' && steps.unix-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        OSX_ARCH: ${{ steps.arch.outputs.osx }}
      run: scripts/build-libheif.sh "$RUNNER_TEMP/libheif"

    - name: Point libheif-sys at the static build
      if: runner.os != 'Windows'
      shell: bash
      run: |
        command -v pkg-config >/dev/null || brew install pkgconf
        echo "PKG_CONFIG_PATH=$RUNNER_TEMP/libheif/lib/pkgconfig" >> "$GITHUB_ENV"
        # Pulls in libde265 and the C++ runtime from Libs.private.
        echo "SYSTEM_DEPS_LIBHEIF_LINK=static" >> "$GITHUB_ENV"
        # The x64 dmg is built on an arm64 runner, which pkg-config treats as cross.
        echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
